name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Default aman: hanya baca. Izin tulis hanya diberikan ke job release.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Minecraft 26.3 -> Fabric merekomendasikan Loom 1.17 + Gradle 9.6.0
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build + test
        run: gradle build --stacktrace --no-daemon

      - name: Upload JAR (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lapershop-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    # Hanya untuk tag v* (mis. v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # diperlukan untuk membuat GitHub Release
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: lapershop-jar
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
